<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws://localhost:*">
    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./scripts/main.ts"></script>

    <title>Terra Widget</title>
</head>
<body>

    <div id="status"></div>
    
    <!-- HTML and styling were extracted from the terra website-->
    <div class="main_progress_container">
        <div class="progress_wrapper">
            <div class="border_container">
                <div class="pipe_container">
                    <div class="fill"></div>
                    <div class="ai_fill"></div>
                    <div class="dev_logged"></div>
                    <div class="ai_cut"></div>
                </div>
            </div>
        </div>
        <div class="progress_label_container">
            <span class="procentage_value">0%</span>
            <span class="label_goal">of a regular week's goal</span>
            <span class="total_hours">Total hours: 0h 0mins</span>
        </div>
    </div>

    <div class="notice" hidden>
        <p>This project is not affiliated with terra or hackclub directly. <br> It's just a fan project. Use at your own risk.</p>
    </div>
    <button class="more_button">
        More
    </button>

    
</body>
</html>
