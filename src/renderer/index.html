<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./scripts/main.ts"></script>
    <script type="module" src="./scripts/progress.ts"></script>

    <title>Terra Widget</title>
</head>
<body>

    <!-- HTML and styling were extracted from the terra website-->
    <div class="main_progress_container">
        <div class="progress_wrapper">
            <div class="border_container">
                <div class="pipe_container">
                    <div class="fill" style="height: 41.2056%;"></div>
                    <div class="ai_fill" style="bottom: 41.2056%; height: 0.0611111%;"></div>
                    <div class="dev_logged" style="height: 34.9556%;"></div>
                    <div class="ai_cut" style="bottom: 41.2667%; height: 0.125%;"></div>
                </div>
            </div>
        </div>
        <div class="progress_label_container">
            <span class="procentage_value">0%</span>
            <span class="label_goal">of a regular week's goal</span>
            <span class="not_vlogged_value">6% not devlogged yet</span>
            <span class="total_hours">Total hours: 12h 30mins</span>
        </div>
    </div>

    <div class="notice" hidden>
        <p>This project is not affiliated with terra or hackclub directly. <br> It's just a fan project. Use at your own risk.</p>
    </div>
    <button class="more_button">
        More
    </button>

    
</body>
</html>
